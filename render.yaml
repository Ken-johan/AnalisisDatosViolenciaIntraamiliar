services:
  - type: web
    name: observatorio-violencia-intrafamiliar
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/build_cache.py
    # Un solo worker con hilos: comparte el DataFrame en memoria (el plan free
    # tiene 512 MB) y evita que cada worker cargue el dataset por separado.
    # El timeout amplio cubre la primera carga del CSV en una CPU de 0,1.
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180 --access-logfile - app:app
    healthCheckPath: /health
