{# Iconos SVG inline: reemplazan a los emojis sin dependencias externas. #}
{% macro icon(name, size='1.1em') -%}
<svg class="ui-icon" xmlns="http://www.w3.org/2000/svg" width="{{ size }}" height="{{ size }}"
     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"
     style="display:inline-block;vertical-align:-0.18em;flex:none">
  {%- if name == 'observatory' -%}
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    <path d="M7.5 12.5h2l1.8-3.2 2.4 6 1.8-2.8h2"/>
  {%- elif name == 'chart' -%}
    <path d="M3 21h18"/>
    <path d="M6 21v-7M11 21V6M16 21v-10M21 21v-4"/>
  {%- elif name == 'search' -%}
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M20 20l-4.8-4.8"/>
  {%- elif name == 'robot' -%}
    <rect x="4" y="8" width="16" height="12" rx="3"/>
    <path d="M12 8V4M9.5 4h5"/>
    <circle cx="9" cy="14" r="0.8"/>
    <circle cx="15" cy="14" r="0.8"/>
    <path d="M9 17h6"/>
  {%- elif name == 'target' -%}
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.3"/>
  {%- elif name == 'lightbulb' -%}
    <path d="M9 18h6M10 22h4"/>
    <path d="M12 2a7 7 0 0 0-4 12.8V17h8v-2.2A7 7 0 0 0 12 2z"/>
  {%- elif name == 'book' -%}
    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
  {%- elif name == 'menu' -%}
    <path d="M4 6h16M4 12h16M4 18h16"/>
  {%- elif name == 'arrow-right' -%}
    <path d="M4 12h15M13 6l6 6-6 6"/>
  {%- elif name == 'clipboard' -%}
    <rect x="8" y="3" width="8" height="4" rx="1"/>
    <path d="M9 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-3"/>
    <path d="M9 12h6M9 16h6"/>
  {%- elif name == 'flag' -%}
    <path d="M5 22V3"/>
    <path d="M5 4h13l-2.5 4L18 12H5"/>
  {%- elif name == 'venus' -%}
    <circle cx="12" cy="8" r="5"/>
    <path d="M12 13v8M9 18h6"/>
  {%- elif name == 'home' -%}
    <path d="M3 11l9-8 9 8"/>
    <path d="M5 10v10h14V10"/>
    <path d="M9.5 20v-6h5v6"/>
  {%- elif name == 'trending-up' -%}
    <path d="M3 17l6-6 4 4 8-8"/>
    <path d="M15 7h6v6"/>
  {%- elif name == 'alert' -%}
    <path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>
    <path d="M12 9v4M12 17h.01"/>
  {%- elif name == 'bolt' -%}
    <path d="M13 2L4 14h7l-1 8 10-13h-7l1-7z"/>
  {%- elif name == 'map' -%}
    <path d="M9 3L3 6v15l6-3 6 3 6-3V3l-6 3-6-3z"/>
    <path d="M9 3v15M15 6v15"/>
  {%- elif name == 'city' -%}
    <path d="M3 21V10l6-3v14M9 21V4l6 3v14M15 21v-8l6-3v11M2 21h20"/>
    <path d="M5.5 12h.01M5.5 16h.01M11.5 10h.01M11.5 14h.01M17.5 16h.01"/>
  {%- elif name == 'scale' -%}
    <path d="M12 3v18M7 21h10"/>
    <path d="M4 7h16"/>
    <path d="M4 7L1.5 13h5L4 7zM20 7l-2.5 6h5L20 7z"/>
  {%- elif name == 'shield-check' -%}
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    <path d="M8.5 12l2.5 2.5 4.5-5"/>
  {%- elif name == 'institution' -%}
    <path d="M2 10h20L12 3 2 10z"/>
    <path d="M5 10v9M9.5 10v9M14.5 10v9M19 10v9"/>
    <path d="M2 21h20"/>
  {%- endif -%}
</svg>
{%- endmacro %}
